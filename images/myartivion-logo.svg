<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" width="1100" height="350">
  <defs>
    <linearGradient id="gradient1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#7AC143;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A3AD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Centered layered triangle pattern - matching your logo -->
  <g transform="translate(230, 175)">
    <!-- Outermost layers - very light -->
    <polygon points="0,-245 254,184 -254,184" fill="#7AC143" opacity="0.12"/>
    <polygon points="0,-219 228,166 -228,166" fill="#6CB844" opacity="0.18"/>
    <polygon points="0,-193 201,144 -201,144" fill="#5FB045" opacity="0.25"/>
    <polygon points="0,-166 175,123 -175,123" fill="#52A846" opacity="0.32"/>
    <polygon points="0,-140 149,105 -149,105" fill="#45A047" opacity="0.42"/>
    <polygon points="0,-114 123,84 -123,84" fill="#389848" opacity="0.55"/>
    <polygon points="0,-88 96,67 -96,67" fill="#2B9049" opacity="0.68"/>
    <polygon points="0,-61 70,44 -70,44" fill="#1E884A" opacity="0.82"/>
    <!-- Inner core - solid gradient -->
    <polygon points="0,-35 44,21 -44,21" fill="url(#gradient1)" opacity="1"/>
  </g>

  <!-- MyARTIVION text with proper styling -->
  <g transform="translate(460, 210)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="145" font-weight="400" fill="#00558C" letter-spacing="-3">
      <tspan font-weight="300">My</tspan><tspan font-weight="700">ARTIVION</tspan>
    </text>
  </g>
</svg>
