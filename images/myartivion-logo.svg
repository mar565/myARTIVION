<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="greenToTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7AC143;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4DA8DA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A3AD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Layered triangular pattern -->
  <g transform="translate(200, 150)">
    <!-- Outer layers (lighter opacity) -->
    <polygon points="0,-120 120,90 -120,90" fill="url(#greenToTeal)" opacity="0.15"/>
    <polygon points="0,-105 105,75 -105,75" fill="url(#greenToTeal)" opacity="0.25"/>
    <polygon points="0,-90 90,60 -90,60" fill="url(#greenToTeal)" opacity="0.35"/>
    <polygon points="0,-75 75,45 -75,45" fill="url(#greenToTeal)" opacity="0.5"/>
    <polygon points="0,-60 60,30 -60,30" fill="url(#greenToTeal)" opacity="0.65"/>
    <polygon points="0,-45 45,15 -45,15" fill="url(#greenToTeal)" opacity="0.8"/>
    <!-- Inner core (full opacity) -->
    <polygon points="0,-30 30,0 -30,0" fill="url(#greenToTeal)" opacity="1"/>
  </g>

  <!-- MyARTIVION text -->
  <text x="430" y="170" font-family="'Arial', 'Helvetica', sans-serif" font-size="80" font-weight="700" fill="#00558C">
    <tspan>My</tspan><tspan font-weight="700">ARTIVION</tspan>
  </text>
</svg>
