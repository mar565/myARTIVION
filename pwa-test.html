<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Test & Diagnose - MyARTIVION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #00558C 0%, #7AC143 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }

        h1 {
            color: #00558C;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .test-section {
            margin: 25px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #00558C;
        }

        .test-section h2 {
            color: #00558C;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .test-item {
            margin: 12px 0;
            padding: 12px;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .status.success {
            background: #4caf50;
            color: white;
        }

        .status.error {
            background: #f44336;
            color: white;
        }

        .status.warning {
            background: #ff9800;
            color: white;
        }

        .status.pending {
            background: #9e9e9e;
            color: white;
        }

        .test-label {
            flex: 1;
            font-size: 14px;
        }

        .test-value {
            font-size: 12px;
            color: #666;
            font-family: monospace;
        }

        button {
            background: #00558C;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }

        button:hover {
            background: #003d66;
        }

        button.secondary {
            background: #7AC143;
        }

        button.secondary:hover {
            background: #6ab036;
        }

        button.danger {
            background: #f44336;
        }

        button.danger:hover {
            background: #d32f2f;
        }

        .buttons {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .console {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .console-line {
            margin: 3px 0;
        }

        .alert {
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }

        .alert.info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            color: #1976d2;
        }

        .alert.success {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #388e3c;
        }

        .alert.error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }

        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 PWA Test & Diagnose</h1>
        <p class="subtitle">MyARTIVION Progressive Web App - Funktionstest</p>

        <div class="alert info">
            <strong>ℹ️ Hinweis:</strong> Diese Seite testet alle PWA-Funktionen. Öffne die Browser-Konsole (F12) für detaillierte Informationen.
        </div>

        <!-- Browser Support -->
        <div class="test-section">
            <h2>🌐 Browser-Unterstützung</h2>
            <div id="browserTests"></div>
        </div>

        <!-- PWA Configuration -->
        <div class="test-section">
            <h2>⚙️ PWA-Konfiguration</h2>
            <div id="configTests"></div>
        </div>

        <!-- Service Worker -->
        <div class="test-section">
            <h2>🔄 Service Worker</h2>
            <div id="swTests"></div>
            <div class="buttons">
                <button onclick="testServiceWorker()">Service Worker Testen</button>
                <button class="danger" onclick="unregisterServiceWorker()">Service Worker Löschen</button>
                <button class="secondary" onclick="updateServiceWorker()">Update Erzwingen</button>
            </div>
        </div>

        <!-- Icons -->
        <div class="test-section">
            <h2>🎨 Icons</h2>
            <div id="iconTests"></div>
        </div>

        <!-- Installation -->
        <div class="test-section">
            <h2>📱 Installation</h2>
            <div id="installTests"></div>
            <div class="buttons">
                <button id="installBtn" onclick="installPWA()" disabled>App Installieren</button>
            </div>
        </div>

        <!-- Console Output -->
        <div class="test-section">
            <h2>📋 Konsole</h2>
            <div class="console" id="console"></div>
            <button onclick="clearConsole()">Konsole Leeren</button>
        </div>
    </div>

    <script>
        let deferredPrompt = null;
        const consoleEl = document.getElementById('console');

        // Console logging
        function log(message, type = 'info') {
            const line = document.createElement('div');
            line.className = 'console-line';
            const timestamp = new Date().toLocaleTimeString();
            line.textContent = `[${timestamp}] ${message}`;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
            console.log(message);
        }

        function clearConsole() {
            consoleEl.innerHTML = '';
        }

        // Test item creator
        function createTestItem(label, status, value = '') {
            const statusEmojis = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                pending: '⏳'
            };

            return `
                <div class="test-item">
                    <div class="status ${status}">${statusEmojis[status]}</div>
                    <div class="test-label">${label}</div>
                    ${value ? `<div class="test-value">${value}</div>` : ''}
                </div>
            `;
        }

        // Browser tests
        function testBrowser() {
            const tests = document.getElementById('browserTests');
            let html = '';

            // HTTPS check
            const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            html += createTestItem(
                'HTTPS / Localhost',
                isSecure ? 'success' : 'error',
                location.protocol + '//' + location.hostname
            );

            // Service Worker support
            html += createTestItem(
                'Service Worker API',
                'serviceWorker' in navigator ? 'success' : 'error'
            );

            // Manifest support
            html += createTestItem(
                'Web App Manifest',
                'onbeforeinstallprompt' in window || navigator.standalone !== undefined ? 'success' : 'warning'
            );

            // Cache API
            html += createTestItem(
                'Cache API',
                'caches' in window ? 'success' : 'error'
            );

            // Browser info
            html += createTestItem(
                'Browser',
                'success',
                navigator.userAgent.match(/(Chrome|Safari|Firefox|Edge)\/[\d.]+/)?.[0] || 'Unbekannt'
            );

            tests.innerHTML = html;
            log('Browser-Tests abgeschlossen');
        }

        // Config tests
        async function testConfig() {
            const tests = document.getElementById('configTests');
            let html = '';

            // Check manifest
            try {
                const response = await fetch('/manifest.json');
                if (response.ok) {
                    const manifest = await response.json();
                    html += createTestItem('manifest.json geladen', 'success', manifest.name);
                    html += createTestItem('Icons im Manifest', manifest.icons?.length ? 'success' : 'error', `${manifest.icons?.length || 0} Icons`);
                    html += createTestItem('Start URL', manifest.start_url ? 'success' : 'warning', manifest.start_url);
                    html += createTestItem('Display Mode', manifest.display ? 'success' : 'warning', manifest.display);
                    log(`Manifest geladen: ${manifest.name}`);
                } else {
                    html += createTestItem('manifest.json', 'error', `HTTP ${response.status}`);
                    log('ERROR: Manifest nicht gefunden');
                }
            } catch (error) {
                html += createTestItem('manifest.json', 'error', error.message);
                log('ERROR: ' + error.message);
            }

            tests.innerHTML = html;
        }

        // Service Worker tests
        async function testServiceWorker() {
            const tests = document.getElementById('swTests');
            let html = '';

            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.getRegistration();

                    if (registration) {
                        html += createTestItem('Service Worker Status', 'success', 'Registriert');
                        html += createTestItem('Scope', 'success', registration.scope);

                        if (registration.active) {
                            html += createTestItem('Aktiver Worker', 'success', registration.active.state);
                        }
                        if (registration.waiting) {
                            html += createTestItem('Wartender Worker', 'warning', 'Update verfügbar');
                        }
                        if (registration.installing) {
                            html += createTestItem('Installierender Worker', 'pending', 'Wird installiert...');
                        }

                        // Test cache
                        const cacheNames = await caches.keys();
                        html += createTestItem('Caches', cacheNames.length ? 'success' : 'warning', `${cacheNames.length} Cache(s)`);

                        for (const cacheName of cacheNames) {
                            const cache = await caches.open(cacheName);
                            const keys = await cache.keys();
                            html += createTestItem(`Cache: ${cacheName}`, 'success', `${keys.length} Einträge`);
                        }

                        log('Service Worker ist aktiv');
                    } else {
                        html += createTestItem('Service Worker', 'error', 'Nicht registriert');
                        log('ERROR: Service Worker nicht registriert');
                    }
                } catch (error) {
                    html += createTestItem('Service Worker', 'error', error.message);
                    log('ERROR: ' + error.message);
                }
            } else {
                html += createTestItem('Service Worker', 'error', 'Nicht unterstützt');
            }

            tests.innerHTML = html;
        }

        // Icon tests
        async function testIcons() {
            const tests = document.getElementById('iconTests');
            let html = '';

            const iconSizes = [72, 96, 128, 144, 152, 192, 384, 512];

            for (const size of iconSizes) {
                const iconUrl = `/icons/icon-${size}x${size}.png`;
                try {
                    const response = await fetch(iconUrl, { method: 'HEAD' });
                    html += createTestItem(
                        `Icon ${size}×${size}`,
                        response.ok ? 'success' : 'error',
                        response.ok ? 'Verfügbar' : `HTTP ${response.status}`
                    );
                } catch (error) {
                    html += createTestItem(`Icon ${size}×${size}`, 'error', 'Nicht erreichbar');
                }
            }

            tests.innerHTML = html;
            log('Icon-Tests abgeschlossen');
        }

        // Installation tests
        function testInstallation() {
            const tests = document.getElementById('installTests');
            let html = '';

            // Check if already installed
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                                window.navigator.standalone ||
                                document.referrer.includes('android-app://');

            html += createTestItem(
                'Installation',
                isStandalone ? 'success' : 'pending',
                isStandalone ? 'App ist installiert' : 'Nicht installiert'
            );

            html += createTestItem(
                'Install Prompt',
                deferredPrompt ? 'success' : 'warning',
                deferredPrompt ? 'Verfügbar' : 'Warte auf Browser-Event...'
            );

            tests.innerHTML = html;
        }

        // Unregister Service Worker
        async function unregisterServiceWorker() {
            if (confirm('Service Worker wirklich löschen? Die Seite wird neu geladen.')) {
                const registration = await navigator.serviceWorker.getRegistration();
                if (registration) {
                    await registration.unregister();
                    const cacheNames = await caches.keys();
                    for (const cacheName of cacheNames) {
                        await caches.delete(cacheName);
                    }
                    log('Service Worker und Caches gelöscht');
                    location.reload();
                }
            }
        }

        // Update Service Worker
        async function updateServiceWorker() {
            const registration = await navigator.serviceWorker.getRegistration();
            if (registration) {
                log('Update wird gesucht...');
                await registration.update();
                log('Update-Check abgeschlossen');
                setTimeout(testServiceWorker, 1000);
            }
        }

        // Install PWA
        async function installPWA() {
            if (!deferredPrompt) {
                alert('Installation ist in diesem Browser nicht verfügbar oder die App ist bereits installiert.');
                return;
            }

            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;

            log(`Installation: ${outcome}`);

            if (outcome === 'accepted') {
                log('✅ App wurde installiert!');
            } else {
                log('❌ Installation abgebrochen');
            }

            deferredPrompt = null;
            testInstallation();
        }

        // Listen for install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').disabled = false;
            log('✅ Install Prompt verfügbar!');
            testInstallation();
        });

        window.addEventListener('appinstalled', () => {
            log('🎉 App wurde installiert!');
            deferredPrompt = null;
            testInstallation();
        });

        // Run all tests
        async function runAllTests() {
            log('🚀 Starte PWA-Tests...');
            testBrowser();
            await testConfig();
            await testServiceWorker();
            await testIcons();
            testInstallation();
            log('✅ Alle Tests abgeschlossen');
        }

        // Run tests on load
        window.addEventListener('load', () => {
            runAllTests();

            // Register service worker if not already registered
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => {
                        log('Service Worker registriert: ' + reg.scope);
                        setTimeout(testServiceWorker, 1000);
                    })
                    .catch(err => log('ERROR: Service Worker Registrierung fehlgeschlagen: ' + err));
            }
        });
    </script>
</body>
</html>
